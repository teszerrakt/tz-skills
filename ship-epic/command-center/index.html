<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ship</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #000; --panel: #0a0a0a; --raised: #111; --hover: #1a1a1a; --line: #2a2a2a;
    --ink: #ededed; --soft: #a1a1a1; --dim: #8f8f8f;
    --you: #f5a623; --bad: #ff6166; --ok: #45d483; --run: #52a8ff; --run-bg: #0a1f38;
    --mono: "Geist Mono", Consolas, ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 "Geist", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
  a { color: var(--run); text-decoration: none; } a:hover { text-decoration: underline; }
  button, textarea { font: inherit; }
  button:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--run); outline-offset: 2px; }
  .mono { font-family: var(--mono); font-size: 12px; color: var(--dim); }
  .label { font-size: 13px; font-weight: 500; color: var(--dim); display: flex; align-items: center; gap: 8px; }
  svg.ic { flex: none; }
  .with { display: inline-flex; align-items: center; gap: 5px; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 32px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header .brand { font-family: var(--mono); font-weight: 500; font-size: 14px; letter-spacing: .04em; }
  header .bar { width: 1px; height: 18px; background: var(--line); }
  header .grow { flex: 1; }
  .where { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; color: var(--soft); }
  .where span { display: flex; align-items: center; gap: 7px; padding: 5px 12px; }
  .where span + span { border-left: 1px solid var(--line); }
  #live { display: flex; align-items: center; gap: 8px; color: var(--ok); }
  #live.off { color: var(--bad); }
  .cols { flex: 1; min-height: 0; display: grid; grid-template-columns: 340px minmax(0, 1fr) 380px; }
  .col { padding: 28px; overflow: auto; display: flex; flex-direction: column; gap: 28px; }
  .col.left { border-right: 1px solid var(--line); padding-left: 32px; }
  .col.right { border-left: 1px solid var(--line); padding-right: 32px; gap: 0; }
  .col.mid { gap: 20px; padding: 24px 32px 48px; }
  @media (max-width: 1180px) {
    body { display: block; }
    .cols { display: block; }
    .col { overflow: visible; padding: 24px 16px; border: 0 !important; border-top: 1px solid var(--line) !important; }
    header { padding: 14px 16px; }
    .col.mid { order: -1; }
  }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  h1 { font-size: 24px; line-height: 1.2; font-weight: 600; letter-spacing: -.025em; margin: 0; }
  .summary { color: var(--soft); }
  .big { display: flex; align-items: baseline; gap: 8px; }
  .big b { font-size: 32px; line-height: 1; font-weight: 600; letter-spacing: -.03em; }
  .segs { display: flex; gap: 3px; }
  .seg { flex: 1; height: 6px; border-radius: 2px; background: var(--line); }
  .segs.tall .seg { height: 8px; }
  .seg.ok { background: var(--ok); } .seg.run { background: var(--run); } .seg.you { background: var(--you); } .seg.bad { background: var(--bad); }
  .order-row { display: flex; gap: 10px; align-items: baseline; font-size: 13.5px; color: var(--soft); }
  .order-row .id { font-family: var(--mono); font-size: 12px; width: 66px; flex: none; color: var(--dim); }
  .order-row .id.ok { color: var(--ok); } .order-row .id.run { color: var(--run); } .order-row .id.you { color: var(--you); } .order-row .id.bad { color: var(--bad); }
  .later { font-size: 13.5px; color: var(--soft); }
  .tabs { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tab { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--soft); font-weight: 500; cursor: pointer; }
  .tab[aria-selected="true"] { border-color: var(--ink); background: var(--hover); color: var(--ink); font-weight: 600; }
  .tabs .grow { flex: 1; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
  .card.focus { border-color: var(--ink); }
  .card.you { border-top: 2px solid var(--you); }
  .top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .top .grow { flex: 1; }
  .ask-ic { display: flex; color: var(--you); }
  .q { font-size: 20px; line-height: 1.35; font-weight: 600; letter-spacing: -.02em; }
  .opts { display: flex; flex-direction: column; gap: 6px; }
  .opt { min-height: 46px; width: 100%; text-align: left; background: var(--raised); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px 14px; cursor: pointer; display: flex; align-items: center; gap: 12px; }
  .opt:hover { border-color: var(--ink); background: var(--hover); }
  .opt.rec, .opt[aria-pressed="true"] { border-color: var(--ink); }
  .opt[aria-pressed="true"] { background: var(--hover); font-weight: 600; }
  .opt .key { font-family: var(--mono); font-size: 11px; color: var(--dim); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; }
  .opt .body { flex: 1; min-width: 0; }
  .opt .name { font-weight: 500; }
  .opt .detail { color: var(--soft); font-size: 13px; }
  .current { min-height: 46px; border: 1px dashed var(--line); border-radius: 6px; padding: 8px 14px; color: var(--dim); display: flex; align-items: center; gap: 12px; }
  .current span:first-child { flex: 1; }
  .pill { font-size: 11px; font-weight: 600; border-radius: 999px; padding: 1px 9px 2px; border: 1px solid currentColor; white-space: nowrap; }
  .pill.rec { color: var(--run); background: var(--run-bg); border-color: transparent; }
  .st { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .st.ok { color: var(--ok); } .st.run { color: var(--run); } .st.bad { color: var(--bad); } .st.wait { color: var(--dim); }
  .st.you { color: #0a0a0a; background: var(--you); border-radius: 999px; padding: 2px 10px 2px 7px; font-weight: 600; }
  pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow-x: auto; font: 12.5px/1.55 var(--mono); color: var(--soft); margin: 0; white-space: pre-wrap; }
  .because { color: var(--dim); font-size: 13px; }
  .free { display: flex; gap: 6px; }
  textarea { flex: 1; min-height: 44px; resize: vertical; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
  textarea::placeholder { color: var(--dim); }
  .btn { display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--ink); font-weight: 500; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--ink); }
  .btn.main { background: var(--ink); color: #0a0a0a; border-color: var(--ink); font-weight: 600; }
  .btn.main:hover { opacity: .88; }
  .btn.main:disabled { background: transparent; color: var(--dim); border-color: var(--line); cursor: default; opacity: 1; }
  .btn.quiet { border-color: transparent; color: var(--soft); }
  .empty { border: 1px dashed var(--line); border-radius: 8px; padding: 36px 28px; }
  .empty b { display: block; font-size: 20px; letter-spacing: -.02em; margin-bottom: 4px; }
  .empty span { color: var(--soft); }
  .dec { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
  .dec .row { display: flex; gap: 16px; align-items: flex-start; }
  .dec .id { width: 66px; flex: none; padding-top: 2px; }
  .dec .main { flex: 1; min-width: 0; }
  .dec .ask { font-weight: 500; }
  .dec .choice { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  .dec .was { color: var(--dim); font-size: 12.5px; }
  .dec .why { color: var(--dim); font-size: 13px; }
  .pill.away { color: var(--you); }
  .find { display: flex; gap: 12px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--line); }
  .find .fid { font-family: var(--mono); font-size: 12px; color: var(--dim); width: 34px; flex: none; }
  .find .main { flex: 1; min-width: 0; }
  .sev { font-family: var(--mono); font-size: 11px; width: 56px; flex: none; }
  .sev.blocker { color: var(--bad); } .sev.major { color: var(--you); } .sev.minor, .sev.note { color: var(--dim); }
  .revise { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 12px; }
  .happens { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; }
  .actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .worker { width: 100%; text-align: left; background: transparent; color: inherit; border: 0; border-bottom: 1px solid var(--line); padding: 14px 0; cursor: pointer; display: flex; flex-direction: column; gap: 8px; }
  .worker:hover .wid { text-decoration: underline; }
  .worker .wid { font-family: var(--mono); font-size: 13px; font-weight: 500; }
  .worker .doing { color: var(--soft); font-size: 13.5px; }
  .story .ev { display: flex; gap: 16px; padding: 12px 0; border-top: 1px solid var(--line); }
  .story .ev .t { width: 48px; flex: none; padding-top: 2px; }
  .story .ev .tone-you { color: var(--you); } .story .ev .tone-bad { color: var(--bad); } .story .ev .tone-ok { color: var(--ok); }
  .story .ev .ei { display: flex; padding-top: 2px; color: var(--dim); }
  .story .ev b { font-weight: 500; display: block; }
  .story .ev span { color: var(--dim); font-size: 13px; }
</style>
</head>
<body>
<header>
  <span class="brand">SHIP</span>
  <span class="bar"></span>
  <select class="mono" id="runPick" aria-label="Which run to show" style="background: var(--bg); color: var(--soft); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px"></select>
  <span class="mono" id="runId" style="color: var(--you)"></span>
  <span class="grow"></span>
  <span class="where" id="where" hidden></span>
  <span class="mono" id="live">connecting</span>
</header>
<div class="cols">
  <aside class="col left" id="left"></aside>
  <main class="col mid" id="mid"></main>
  <aside class="col right" id="right"></aside>
</div>

<script>
const WORDS = {
  'question': ['waiting for you', 'you'],
  'waiting-slot': ['waiting for a free slot', 'wait'],
  'usage-limit': ['ran out of usage', 'bad'],
  'blocked-by-ticket': ['waiting for a ticket', 'wait'],
  'gate-failed': ['a check failed', 'bad'],
  'done': ['finished', 'ok'],
  'merged': ['merged', 'ok'],
  '': ['working', 'run'],
  'queued': ['not started', 'wait'],
}
const ICONS = {
  monitor: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>',
  inbox: '<path d="M3 13l3-8h12l3 8v5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 13h5l1.5 3h5L16 13h5"/>',
  list: '<path d="M4 6l1.5 1.5L8 5M4 12l1.5 1.5L8 11M4 18l1.5 1.5L8 17M12 6h8M12 12h8M12 18h8"/>',
  box: '<path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  order: '<path d="M4 6h16M4 12h10M4 18h6"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  cpu: '<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
  check: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/>',
  pulse: '<path d="M3 12h4l3-8 4 16 3-8h4"/>',
  ask: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/>',
  pause: '<circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/>',
  alert: '<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/>',
  pr: '<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5v7M18 15.5V10a3 3 0 0 0-3-3h-3"/>',
  pencil: '<path d="M4 20l1-4L16 5l3 3L8 19z"/>',
  back: '<path d="M19 12H5M11 6l-6 6 6 6"/>',
  up: '<path d="M12 19V5M6 11l6-6 6 6"/>',
  play: '<circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z"/>',
  steps: '<path d="M4 18h4v-4h4v-4h4V6h4"/>',
  link: '<path d="M14 5h5v5M19 5l-8 8M17 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h4"/>',
}
const TONE_ICON = { ok: 'check', run: 'pulse', you: 'ask', wait: 'pause', bad: 'alert' }
const EVENT_ICON = { asked: 'ask', decided: 'ask', changed: 'pencil', read: 'check', step: 'pulse', 'usage-limit': 'alert', 'gate-failed': 'alert', done: 'check', merged: 'pr', finding: 'alert', review: 'list' }
const OUTCOME = { open: ['open', 'you'], fixed: ['fixed', 'ok'], refused: ['not fixed, with a reason', 'bad'], withdrawn: ['withdrawn', 'wait'], held: ['still open after a second look', 'bad'] }
function icon(name, size = 16) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
  for (const [k, v] of Object.entries({ class: 'ic', width: size, height: size, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor',
    'stroke-width': 1.6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true' })) s.setAttribute(k, v)
  s.innerHTML = ICONS[name] || ''
  return s
}
const ui = { tab: 'inbox', ticket: '', revising: '', pick: '', note: '', drafts: {} }
let state = null
let live = null
const $ = (id) => document.getElementById(id)

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue
    if (k === 'class') n.className = v
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v)
    else n.setAttribute(k, v === true ? '' : v)
  }
  for (const kid of kids.flat()) if (kid != null && kid !== '' && kid !== false) n.append(kid)
  return n
}
const clock = (iso) => iso ? new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : ''
const ago = (iso) => {
  const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000))
  return m < 1 ? 'just now' : m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`
}

async function post(url, body) {
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
  const json = await res.json()
  if (!res.ok) alert(json.error)
  return res.ok
}

function go(patch) { Object.assign(ui, patch); render() }

function tickets() {
  const planned = state.run?.tickets || []
  const seen = new Set(planned.map((t) => t.ticket))
  const extra = Object.keys(state.workers).filter((t) => !seen.has(t)).map((ticket) => ({ ticket, title: '', group: 0, after: '' }))
  return [...planned, ...extra].map((t) => {
    const w = state.workers[t.ticket]
    const pr = state.prs[t.ticket]
    const key = pr?.state === 'MERGED' ? 'merged' : w ? (w.stopped || '') : 'queued'
    const [word, tone] = WORDS[key]
    const [at, of] = String(w?.step || '').split('/').map(Number)
    return { ...t, w, pr, key, word, tone, at: at || 0, of: of || 12 }
  })
}

const label = (name, text, style) => el('div', { class: 'label', style }, icon(name, 15), text)
const stat = (t) => el('span', { class: 'st ' + t.tone }, icon(TONE_ICON[t.tone], 14), t.word)
const brain = (t) => t.w?.model || ''
const sess = (key) => state.sessions?.[key]
function attachLine(key) {
  const x = sess(key)
  if (!x?.id) return ''
  const cmd = `claude attach ${x.id}`
  const btn = el('button', { type: 'button', class: 'btn quiet', style: 'min-height: 28px; padding: 0 8px', onclick: async (e) => {
    e.stopPropagation()
    try { await navigator.clipboard.writeText(cmd); btn.textContent = 'copied' } catch { btn.textContent = 'copy failed' }
  } }, 'copy')
  return el('div', { class: 'mono with', title: `session ${x.sessionId || x.id}${x.cwd ? ' in ' + x.cwd : ''}` },
    icon('link', 13), cmd, x.status === 'gone' ? ' · session ended' : '', btn)
}

function segs(t, tall) {
  const done = t.key === 'done' || t.key === 'merged'
  return el('div', { class: 'segs' + (tall ? ' tall' : ''), 'aria-hidden': 'true' },
    Array.from({ length: t.of }, (_, i) => el('div', { class: 'seg ' + (done || i + 1 < t.at ? 'ok' : i + 1 === t.at ? t.tone : '') })))
}

function renderLeft() {
  const run = state.run
  const all = tickets().filter((t) => !run || t.group > 0)
  const merged = all.filter((t) => t.key === 'merged').length
  const groups = [...new Set(all.map((t) => t.group))].sort((a, b) => a - b)
  $('runId').textContent = ui.view ? 'past run · read only' : run ? '' : 'no run set'
  $('where').hidden = !run?.where
  $('where').replaceChildren(...String(run?.where || '').split('·').map((part, i) => el('span', {}, icon(i === 0 ? 'monitor' : 'user', 15), part.trim())))
  $('left').replaceChildren(
    el('div', { class: 'stack' },
      label('box', 'What this run ships'),
      el('h1', {}, run?.title || 'No run is set yet'),
      run?.summary ? el('div', { class: 'summary' }, run.summary) : '',
      run && sess('orchestrator') ? el('div', { class: 'stack', style: 'gap: 2px' }, el('div', { class: 'mono' }, 'Orchestrator'), attachLine('orchestrator')) : '',
      run ? el('div', { class: 'mono' }, [run.repo, run.target && `PRs target ${run.target}`, `started ${clock(run.startedAt)}`].filter(Boolean).join(' · '))
          : el('div', { class: 'summary' }, 'The orchestrator sets this when a run starts.')),
    all.length ? el('div', { class: 'stack' },
      el('div', { class: 'big' }, el('b', {}, String(merged)), el('span', { class: 'summary' }, `of ${all.length} tickets merged`)),
      el('div', { class: 'segs tall', 'aria-hidden': 'true' }, all.map((t) => el('div', { class: 'seg ' + (t.key === 'queued' ? '' : t.tone) })))) : '',
    all.length ? el('div', { class: 'stack' },
      label('order', 'Order of work'),
      groups.map((g, i) => el('div', { class: 'stack', style: 'gap: 6px' },
        groups.length > 1 ? el('div', { class: 'mono' }, i === 0 ? 'First' : i === groups.length - 1 ? 'Last' : 'Then') : '',
        all.filter((t) => t.group === g).map((t) => el('div', { class: 'order-row' },
          el('span', { class: 'id ' + (t.key === 'queued' ? '' : t.tone) }, t.ticket),
          el('span', {}, t.title || t.w?.doing || '', t.after ? el('span', { class: 'mono' }, ` · after ${t.after}`) : '')))))) : '',
    state.followUps.length ? el('div', { class: 'stack' },
      label('clock', `Left for later · ${state.followUps.length}`),
      state.followUps.map((f) => el('div', { class: 'later' }, f.sentence))) : '')
}

function questionCard(q, more) {
  const box = el('textarea', { rows: 1, placeholder: 'Type your own answer, or a note to go with your pick', 'aria-label': 'Your own answer or a note', 'data-draft': q.id })
  box.value = ui.drafts[q.id] || ''
  box.addEventListener('input', () => (ui.drafts[q.id] = box.value))
  const answer = async (choice) => {
    const note = box.value.trim()
    if (!choice && !note) return
    if (await post(`/api/questions/${q.id}/answer`, { choice, note })) delete ui.drafts[q.id]
  }
  box.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) answer('') })
  const t = tickets().find((x) => x.ticket === q.ticket)
  const behind = tickets().filter((x) => x.after === q.ticket).map((x) => x.ticket)
  return el('div', { class: 'card you' + (location.hash === '#' + q.id ? ' focus' : ''), id: q.id },
    el('div', { class: 'top mono' }, el('span', { class: 'ask-ic' }, icon('ask', 16)), el('span', { style: 'color: var(--ink)' }, q.ticket),
      el('span', {}, t?.title || ''), el('span', { class: 'grow' }), el('span', {}, `asked ${clock(q.askedAt)} · waiting ${ago(q.askedAt)}`)),
    el('div', { class: 'q' }, q.question),
    el('div', { class: 'opts' }, q.options.map((o, i) => el('button', { type: 'button', class: 'opt' + (i === q.recommended ? ' rec' : ''), onclick: () => answer(o.label) },
      el('span', { class: 'key' }, String(i + 1)),
      el('span', { class: 'body' }, el('div', { class: 'name' }, o.label), o.detail ? el('div', { class: 'detail' }, o.detail) : ''),
      i === q.recommended ? el('span', { class: 'pill rec' }, 'Recommended') : ''))),
    q.example ? el('pre', {}, q.example) : '',
    q.because ? el('div', { class: 'because' }, 'Asked because: ' + q.because) : '',
    el('div', { class: 'free' }, box, el('button', { type: 'button', class: 'btn main', onclick: () => answer('') }, icon('up'), 'Send text')),
    el('div', { class: 'mono' }, [`Stops ${q.ticket}${t?.w?.step ? ` at step ${t.w.step.replace('/', ' of ')}` : ''}.`,
      behind.length ? `${behind.join(', ')} waits behind it.` : 'Nothing else waits on it.'].join(' ')))
}

function decisionRow(d) {
  const revising = ui.revising === d.id
  const finished = ['done', 'merged'].includes(state.workers[d.ticket]?.stopped)
  const last = (d.history || []).at(-1)
  const delivery = { 'sent': 'sent, the worker has not read it yet', 'read': `read by the worker at ${clock(d.readAt)}`, 'follow-up': 'saved as a follow-up' }[d.delivery]
  const row = el('div', { class: 'row' },
    el('div', { class: 'id mono' }, d.ticket, d.dn ? el('div', {}, d.dn) : ''),
    el('div', { class: 'main' },
      d.by === 'orchestrator' ? el('div', {}, el('span', { class: 'pill away' }, 'decided while you were away')) : '',
      el('div', { class: 'ask' }, d.question),
      el('div', { class: 'choice' }, d.choice),
      last ? el('div', { class: 'was' }, `changed ${clock(d.revisedAt)} · was "${last.choice}" · ${delivery}`) : '',
      d.note ? el('div', { class: 'why' }, d.note) : ''),
    el('div', { class: 'mono', style: 'padding-top: 2px' }, clock(d.at)),
    !revising && !ui.view && d.options.length > 1 ? el('button', { type: 'button', class: 'btn', onclick: () => go({ revising: d.id, pick: '', note: '' }) }, icon('pencil', 14), 'Change') : '')
  if (!revising) return el('div', { class: 'dec', id: 'd-' + d.id }, row)

  const note = el('textarea', { rows: 1, placeholder: 'Why the change? The worker reads this.', 'aria-label': 'Why you changed it', 'data-draft': 'rev' })
  note.value = ui.note
  note.addEventListener('input', () => (ui.note = note.value))
  return el('div', { class: 'dec', id: 'd-' + d.id }, row,
    el('div', { class: 'revise' },
      el('div', { class: 'label' }, 'Pick the new answer'),
      el('div', { class: 'opts' }, d.options.map((label) => label === d.choice
        ? el('div', { class: 'current' }, el('span', {}, label), el('span', { class: 'mono' }, 'your answer now'))
        : el('button', { type: 'button', class: 'opt', 'aria-pressed': String(ui.pick === label), onclick: () => go({ pick: label }) }, el('span', { class: 'body name' }, label)))),
      note,
      el('div', { class: 'happens' }, el('div', { class: 'label' }, 'What happens'),
        finished ? `${d.ticket} is already finished. The old answer stays in the code. Your new answer is saved as a follow-up for a new ticket.`
                 : `${d.ticket} is still working. It gets your new answer at its next step and redoes what the old one touched.`),
      el('div', { class: 'actions' },
        el('button', { type: 'button', class: 'btn main', disabled: !ui.pick, onclick: async () => {
          if (await post(`/api/decisions/${d.id}/revise`, { choice: ui.pick, note: ui.note.trim() })) go({ revising: '', pick: '', note: '' })
        } }, !ui.pick ? 'Pick a different answer first' : finished ? 'Save as a follow-up' : `Send to ${d.ticket}`),
        el('button', { type: 'button', class: 'btn quiet', onclick: () => go({ revising: '', pick: '', note: '' }) }, 'Keep my answer'))))
}

function story(t) {
  const events = state.events[t.ticket] || []
  const tone = { asked: 'you', decided: 'you', changed: 'you', 'usage-limit': 'bad', 'gate-failed': 'bad', done: 'ok', merged: 'ok', finding: 'you' }
  const found = findings(t.ticket)
  return el('div', { class: 'card story' },
    el('div', { class: 'top' }, el('button', { type: 'button', class: 'btn quiet', style: 'margin-left: -16px', onclick: () => go({ ticket: '' }) }, icon('back', 15), 'Back'),
      el('span', { class: 'grow' }), stat(t)),
    el('div', { class: 'mono' }, [t.ticket, t.after && `after ${t.after}`].filter(Boolean).join(' · ')),
    el('h1', {}, t.title || t.ticket),
    el('div', { class: 'top mono' }, t.w?.startedAt ? el('span', {}, `started ${clock(t.w.startedAt)} · ${ago(t.w.startedAt)} ago`) : '',
      t.pr || t.w?.pr ? el('a', { class: 'with', href: t.pr?.url || t.w.pr, target: '_blank', rel: 'noopener' }, icon('pr', 13), t.pr ? 'PR #' + t.pr.number : 'PR') : '',
      t.url ? el('a', { class: 'with', href: t.url, target: '_blank', rel: 'noopener' }, icon('link', 13), 'Ticket') : ''),
    brain(t) ? el('div', { class: 'mono with' }, icon('cpu', 14), brain(t)) : '',
    attachLine(t.ticket),
    sess(t.ticket)?.sessionId ? el('div', { class: 'mono' }, `session ${sess(t.ticket).sessionId}`) : '',
    el('div', { class: 'stack', style: 'gap: 8px' }, label('steps', t.at ? `Step ${t.at} of ${t.of}` : 'Steps'), segs(t, true)),
    found.length || reviews(t.ticket).length ? el('div', {}, label('alert', `Findings · ${found.filter((f) => f.outcome === 'open' || f.outcome === 'held').length} open`, 'padding-bottom: 10px'),
      reviewLine(t.ticket), found.map(findingRow)) : '',
    el('div', {}, label('clock', 'What happened', 'padding-bottom: 10px'),
      events.length ? events.map((e) => el('div', { class: 'ev' }, el('div', { class: 't mono tone-' + (tone[e.kind] || '') }, clock(e.at)),
        el('div', { class: 'ei tone-' + (tone[e.kind] || '') }, icon(EVENT_ICON[e.kind] || 'pulse', 16)),
        el('div', {}, el('b', {}, e.text), e.detail ? el('span', {}, e.detail) : '')))
      : el('div', { class: 'summary' }, 'Nothing recorded yet.')))
}

const findings = (ticket) => (state.findings || []).filter((f) => f.ticket === ticket)
const reviews = (ticket) => (state.reviews || []).filter((r) => r.ticket === ticket)
const reviewLine = (ticket) => reviews(ticket).length
  ? el('div', { class: 'mono', style: 'padding-bottom: 6px' }, reviews(ticket).map((r) => `${r.by || 'review'}: ${r.verdict}`).join(' · ')) : ''

function findingRow(f) {
  const [word, tone] = OUTCOME[f.outcome] || [f.outcome, 'wait']
  const was = (f.history || []).map((h) => h.outcome).join(' → ')
  return el('div', { class: 'find' },
    el('span', { class: 'fid' }, f.id),
    el('span', { class: 'sev ' + f.severity }, f.severity),
    el('div', { class: 'main' }, el('div', {}, f.claim),
      el('div', { class: 'mono' }, [f.by && `found by ${f.by}`, f.anchor, was && `was ${was}`].filter(Boolean).join(' · '))),
    el('span', { class: 'st ' + tone }, icon(TONE_ICON[tone], 14), word))
}

function findingList() {
  const all = state.findings || []
  if (!all.length && !(state.reviews || []).length) return [el('div', { class: 'empty' }, el('b', {}, 'No findings yet.'),
    el('span', {}, 'Each reviewer finding lands here, with who found it and what happened to it.'))]
  const byTicket = [...new Set([...all, ...(state.reviews || [])].map((f) => f.ticket))]
  const rank = { blocker: 0, major: 1, minor: 2, note: 3 }
  return byTicket.map((ticket) => el('div', { class: 'dec' },
    el('div', { class: 'top' }, el('span', { class: 'wid mono', style: 'color: var(--ink)' }, ticket), el('span', { class: 'grow' }), reviewLine(ticket)),
    [...findings(ticket)].sort((a, b) => (rank[a.severity] ?? 9) - (rank[b.severity] ?? 9)).map(findingRow)))
}

function mergeList() {
  const all = tickets().filter((t) => !state.run || t.group > 0)
  const byId = Object.fromEntries(all.map((t) => [t.ticket, t]))
  const merged = all.filter((t) => t.key === 'merged').sort((a, b) => String(a.pr?.mergedAt).localeCompare(String(b.pr?.mergedAt)))
  const depth = (t, seen = 0) => (t.after && byId[t.after] && seen < 20 ? 1 + depth(byId[t.after], seen + 1) : 0)
  const open = all.filter((t) => t.key !== 'merged' && t.pr && t.pr.state === 'OPEN')
    .sort((a, b) => depth(a) - depth(b) || a.group - b.group || a.ticket.localeCompare(b.ticket))
  const none = all.filter((t) => t.key !== 'merged' && !(t.pr && t.pr.state === 'OPEN'))
  if (!all.some((t) => t.pr)) return [el('div', { class: 'empty' }, el('b', {}, 'No PR yet.'), el('span', {}, 'PRs show up here once a worker opens one. The order follows which ticket waits for which.'))]

  const note = (t) => {
    const parent = t.after && byId[t.after]
    if (parent && parent.key !== 'merged') return [`wait: merge ${parent.pr ? '#' + parent.pr.number : parent.ticket} first`, 'wait']
if (t.pr.draft) return ['still a draft', 'run']
    if (t.w && t.key !== 'done') return ['worker is still on it', 'run']
    const c = t.pr.checks
    if (!c) return ['could not read its checks', 'wait']
    if (c.ci === 'failing') return ['CI is failing', 'bad']
    if (c.ci === 'running') return ['CI is running', 'run']
    if (c.threads) return [`${c.threads} review thread${c.threads > 1 ? 's' : ''} open`, 'you']
    if (c.rabbit === 'waiting') return ['waiting on CodeRabbit', 'wait']
    if (c.rabbit === 'limited') return ['can merge now, CodeRabbit skipped it', 'ok']
    return ['can merge now', 'ok']
  }
  const row = (n, t, words, tone) => el('div', { class: 'dec' }, el('div', { class: 'row' },
    el('div', { class: 'mono', style: 'width: 24px; flex: none; padding-top: 2px' }, n),
    el('div', { class: 'id mono' }, t.ticket),
    el('div', { class: 'main' },
      el('div', { class: 'ask' }, t.title || t.pr?.title || ''),
      el('div', { class: 'top mono' },
        t.pr ? el('a', { class: 'with', href: t.pr.url, target: '_blank', rel: 'noopener' }, icon('pr', 13), '#' + t.pr.number) : '',
        t.pr?.checks ? [
          { green: 'CI green', running: 'CI running', failing: 'CI failing: ' + t.pr.checks.failing.join(', '), none: 'no CI' }[t.pr.checks.ci],
          { reviewed: 'CodeRabbit reviewed', limited: 'CodeRabbit rate limited, did not review', waiting: 'CodeRabbit not done' }[t.pr.checks.rabbit],
          `${t.pr.checks.threads} thread${t.pr.checks.threads === 1 ? '' : 's'} open`,
        ].join(' · ') : '')),
    el('span', { class: 'st ' + tone }, icon(TONE_ICON[tone], 14), words)))
  let n = 0
  return [
    merged.length ? label('check', `Merged · ${merged.length}`) : '',
    ...merged.map((t) => row(String(++n), t, t.pr?.mergedAt ? `merged ${clock(t.pr.mergedAt)}` : 'merged', 'ok')),
    open.length ? label('order', `Merge next, in this order · ${open.length}`, 'padding-top: 12px') : '',
    ...open.map((t) => row(String(++n), t, ...note(t))),
    none.length ? label('pause', `No PR yet · ${none.length}`, 'padding-top: 12px') : '',
    ...none.map((t) => row('', t, t.after && byId[t.after]?.key !== 'merged' ? `starts after ${t.after}` : t.word, 'wait')),
  ].filter(Boolean)
}

function renderMid() {
  const open = state.questions.filter((q) => !q.answer)
  const stopped = new Set(open.map((q) => q.ticket)).size
  const t = ui.ticket && tickets().find((x) => x.ticket === ui.ticket)
  document.title = (open.length ? `(${open.length}) ` : '') + 'Ship'

  const active = document.activeElement
  const draft = active?.dataset?.draft
  const caret = draft ? active.selectionStart : 0

  const tabs = el('div', { class: 'tabs', role: 'tablist' },
    el('button', { type: 'button', class: 'tab', role: 'tab', 'aria-selected': String(!t && ui.tab === 'inbox'), onclick: () => go({ tab: 'inbox', ticket: '' }) }, icon('inbox'), `Needs you · ${open.length}`),
    el('button', { type: 'button', class: 'tab', role: 'tab', 'aria-selected': String(!t && ui.tab === 'decisions'), onclick: () => go({ tab: 'decisions', ticket: '' }) }, icon('list'), `Decisions · ${state.decisions.length}`),
    el('button', { type: 'button', class: 'tab', role: 'tab', 'aria-selected': String(!t && ui.tab === 'findings'), onclick: () => go({ tab: 'findings', ticket: '' }) }, icon('alert'), `Findings · ${(state.findings || []).filter((f) => f.outcome === 'open' || f.outcome === 'held').length} open`),
    el('button', { type: 'button', class: 'tab', role: 'tab', 'aria-selected': String(!t && ui.tab === 'merge'), onclick: () => go({ tab: 'merge', ticket: '' }) }, icon('pr'), `Merge order · ${tickets().filter((x) => x.pr).length}`),
    el('span', { class: 'grow' }),
    el('span', { class: 'mono' }, stopped ? `${stopped} worker${stopped > 1 ? 's' : ''} stopped until you answer` : 'no worker is stopped'))

  let body
  if (t) body = [story(t)]
  else if (ui.tab === 'inbox') body = open.length ? open.map((q) => questionCard(q)) : [el('div', { class: 'empty' }, el('b', {}, 'Nothing needs you.'),
    el('span', {}, 'Every worker can keep going. Your answers are under Decisions, and you can change them there.'))]
  else if (ui.tab === 'merge') body = mergeList()
  else if (ui.tab === 'findings') body = findingList()
  else body = state.decisions.length ? [...state.decisions].reverse().map(decisionRow) : [el('div', { class: 'empty' }, el('b', {}, 'No decisions yet.'),
    el('span', {}, 'Each answer you give lands here.'))]

  $('mid').replaceChildren(tabs, ...body)
  if (draft) {
    const box = document.querySelector(`[data-draft="${draft}"]`)
    if (box) { box.focus(); box.setSelectionRange(caret, caret) }
  }
}

function renderRight() {
  const all = tickets()
  $('right').replaceChildren(label('cpu', 'Workers'),
    ...(all.length ? all.map((t) => el('button', { type: 'button', class: 'worker', onclick: () => go({ ticket: t.ticket }) },
      el('div', { class: 'top' }, el('span', { class: 'wid' }, t.ticket), stat(t), el('span', { class: 'grow' }),
        t.pr ? el('span', { class: 'mono with' }, icon('pr', 13), '#' + t.pr.number) : '',
        el('span', { class: 'mono' }, t.key === 'merged' && t.pr?.mergedAt ? clock(t.pr.mergedAt) : t.w ? clock(t.w.at) : '')),
      el('div', { class: 'doing' }, (t.key === 'merged' && !t.w ? t.title : t.w?.doing) || t.title || (t.after ? `Starts when ${t.after} is merged.` : '')),
      segs(t),
      t.at ? el('div', { class: 'mono' }, `step ${t.at} of ${t.of}`) : '',
      brain(t) ? el('div', { class: 'mono with' }, icon('cpu', 13), brain(t)) : '',
      sess(t.ticket)?.id ? el('div', { class: 'mono' }, `attach ${sess(t.ticket).id}${sess(t.ticket).status === 'gone' ? ' · ended' : ''}`) : ''))
    : [el('div', { class: 'summary', style: 'padding-top: 14px' }, 'No worker has reported yet.')]))
}

function render() {
  if (!state) return
  renderLeft(); renderMid(); renderRight()
}

function route() {
  const hash = location.hash.slice(1)
  if (hash.startsWith('t-')) ui.ticket = hash.slice(2)
  else if (hash) Object.assign(ui, { ticket: '', tab: state?.decisions.some((d) => d.id === hash && !state.questions.some((q) => q.id === hash && !q.answer)) ? 'decisions' : 'inbox' })
}

async function loadRuns() {
  try { ui.runs = await (await fetch('/api/runs')).json() } catch { ui.runs = [] }
  const pick = $('runPick')
  pick.replaceChildren(...ui.runs.map((r) => el('option', { value: r.live ? '' : r.id, selected: (r.live ? '' : r.id) === ui.view },
    `${r.id}${r.live ? ' · live' : ''}${r.startedAt ? ' · ' + new Date(r.startedAt).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : ''}`)))
  pick.hidden = !ui.runs.length
}
const EMPTY = { run: null, questions: [], workers: {}, decisions: [], followUps: [], events: {}, outbox: {}, prs: {}, findings: [], reviews: [], sessions: {} }
async function show(view) {
  ui.view = view
  ui.ticket = ''
  state = view ? { ...EMPTY, ...(await (await fetch('/api/runs/' + encodeURIComponent(view))).json()) } : live
  render()
}

function connect() {
  const es = new EventSource('/api/events')
  es.onopen = () => { $('live').replaceChildren(icon('pulse', 14), 'live'); $('live').className = 'mono with' }
  es.onmessage = (e) => {
    const first = !live
    const prevRun = live?.run?.id
    live = { ...EMPTY, ...JSON.parse(e.data) }
    if (live.run?.id !== prevRun) loadRuns()
    if (ui.view) return
    state = live
    if (first) route()
    render()
  }
  es.onerror = () => { $('live').replaceChildren(icon('alert', 14), 'not connected'); $('live').className = 'mono with off' }
}
connect()
$('runPick').addEventListener('change', (e) => show(e.target.value))
window.addEventListener('hashchange', () => { route(); render() })
setInterval(() => { if (state && !document.activeElement?.dataset?.draft) render() }, 60000)
</script>
</body>
</html>
